# Private graders for the agent-suitability suite (`vgi-lint simulate`).
#
# The prompts are published in the catalog's vgi.agent_test_tasks tag
# (crates/units-worker/src/lib.rs); the answers live here, keyed by task name, so the
# agent being graded never sees them. vgi-lint discovers this file in the
# directory it runs from (the repo root in CI).

tasks:
  - name: "kwh_to_joules"
    reference_sql: "SELECT units.main.convert(100, 'kWh', 'J') AS joules"
  - name: "richest_dimension"
    reference_sql: "SELECT dimension, count(*) AS n FROM units.main.supported_units GROUP BY dimension ORDER BY n DESC, dimension LIMIT 1"
  - name: "parse_and_normalize_to_si"
    reference_sql: "WITH q AS (SELECT units.main.parse_quantity('5 km') AS p) SELECT units.main.to_base((p).value, (p).unit) AS base_value FROM q"
  - name: "dimension_of_unit"
    reference_sql: "SELECT units.main.dimension('kWh') AS dimension"
  - name: "compatible_units_check"
    reference_sql: "SELECT a AS unit_a, b AS unit_b, units.main.compatible(a, b) AS is_compatible FROM (VALUES (1, 'mi', 'km'), (2, 'kg', 'lb'), (3, 'kg', 'm'), (4, 'mi', 'zzz')) AS t(ord, a, b) ORDER BY ord"
